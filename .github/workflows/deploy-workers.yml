# Tự động triển khai máy chủ phòng chùa (worker/phong) lên Cloudflare.
# Cần 2 secret trong GitHub: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — xem docs/HUONG-DAN-CLOUDFLARE.md
# Chưa có secret thì bước triển khai tự bỏ qua (không báo lỗi).
name: Triển khai máy chủ Cloudflare
on:
  push:
    branches: [ccr-c1e2e7ed-k0ue6s]
    paths: ['worker/phong/**', '.github/workflows/deploy-workers.yml']
  workflow_dispatch:
jobs:
  phong:
    runs-on: ubuntu-latest
    steps:
      - id: chk
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::Chưa có CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — bỏ qua triển khai."; fi
      - if: steps.chk.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.chk.outputs.ok == '1'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/phong
      - if: steps.chk.outputs.ok == '1'
        run: |
          echo "### Máy chủ phòng chùa đã triển khai 🙏" >> "$GITHUB_STEP_SUMMARY"
          echo "Địa chỉ: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dán vào index.html: \`ONLINE.url = 'wss://<địa chỉ trên, bỏ https://>/room/an-lac'\`" >> "$GITHUB_STEP_SUMMARY"
