<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2340">
<meta name="description" content="Lên Đền Thanh Vân – dạo đền lúc hoàng hôn: dâng hương, gieo quẻ Dịch, xin chữ, thưởng trà, tĩnh tọa, đọc Đạo Đức Kinh.">
<title>Lên Đền Thanh Vân</title>
<!--
  ============================================================
  LÊN CHÙA CẦU AN — game web 3D một file
  - Three.js qua CDN (importmap, ES module). Mọi hình khối dựng bằng code.
  - Mọi âm thanh tạo bằng Web Audio. Không ảnh/âm thanh/mô hình tải ngoài.
  - Dữ liệu chỉ lưu trên máy (localStorage). Không đăng nhập, không quảng cáo.
  ============================================================
-->
<style>
/* ===== GIAO DIỆN: biến màu & nền ===== */
:root{
  --gold:#f4c46a; --gold2:#d9a441; --red:#b3262b; --red2:#8a1f1c;
  --ink:#2b1a12; --paper:#fff4e2; --paper2:#f6e3c4; --lam:#7896b0;
  --glass:rgba(32,18,28,.62); --line:rgba(255,220,160,.28);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a2e;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:Georgia,"Times New Roman","Noto Serif",serif}
.hidden{display:none!important}

/* ===== HUD trên cùng ===== */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:20}
#counter{pointer-events:none;background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;font-size:13px;line-height:1.25;max-width:62vw;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#counter b{color:var(--gold);font-variant-numeric:tabular-nums}
#hudBtns{display:flex;gap:6px;pointer-events:auto}
.hbtn{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hbtn:active{transform:scale(.94)}
@media (max-width:420px){.hbtn{width:40px;height:40px}#hudBtns{gap:5px}#counter{font-size:12px;padding:6px 10px}#hudLeft{max-width:44vw}}
.hbtn svg{width:22px;height:22px;fill:none;stroke:#ffe6b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#hudLeft{display:flex;flex-direction:column;gap:5px;align-items:flex-start;max-width:62vw}
.pill{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:#ffe9cc;text-align:left;line-height:1.3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#lunarPill{pointer-events:none}
#questPill{cursor:pointer;color:#ffe2a8;border-color:rgba(244,196,106,.5)}
#emotes{position:fixed;right:calc(14px + var(--sar));bottom:calc(112px + var(--sab));z-index:16;display:flex;flex-direction:column;gap:8px}
#emotes button{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:21px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#emotes button:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px}
.chip{padding:8px 13px;border-radius:999px;border:2px solid #e3c79a;background:#fffaf0;color:#4a2a1a;font-size:14px}
.chip.on{border-color:var(--red);background:#fff0e0;font-weight:700}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3c79a}
.sw.on{box-shadow:0 0 0 3px var(--red)}
#panel.look #sheet{max-height:52vh;padding-top:14px}#panel.look .sub{display:none}#panel.look .h3{font-size:15px;margin:4px 0 2px}#panel.look .chip{padding:6px 11px;font-size:13px}#panel.look .sw{width:30px;height:30px}
@media (min-width:700px){#panel.look{align-items:flex-end}}
/* ===== Nhãn nổi, bong bóng chữ, tên người chơi ===== */
#labels,#bubbles{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;
  padding:3px 9px;border-radius:999px;background:rgba(60,20,16,.66);border:1px solid rgba(244,196,106,.55);color:#ffe2a8;
  transition:opacity .3s;will-change:transform}
.nametag{background:rgba(120,150,176,.75);border-color:rgba(255,255,255,.6);color:#fff;font-weight:600}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:180px;font-size:13px;line-height:1.3;
  padding:6px 10px;border-radius:14px;background:rgba(255,248,234,.94);color:#4a2a1a;box-shadow:0 2px 10px rgba(0,0,0,.25);
  white-space:normal;text-align:center;opacity:0;transition:opacity .35s;will-change:transform}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(255,248,234,.94);border-bottom:0}
.bub.on{opacity:1}

/* ===== Cần điều khiển ảo ===== */
#joyZone{position:fixed;left:0;bottom:0;width:46vw;height:48vh;z-index:15;touch-action:none}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,230,180,.10),rgba(255,230,180,.22));border:2px solid rgba(255,230,180,.45);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffe9bd,#d9a441);box-shadow:0 2px 10px rgba(0,0,0,.35)}

/* ===== Nút hành động lớn ===== */
#actBtn{position:fixed;right:calc(18px + var(--sar));bottom:calc(28px + var(--sab));z-index:16;min-width:150px;height:68px;padding:0 22px;
  border-radius:34px;background:linear-gradient(180deg,#d8443a,#9d1f1d);border:2px solid var(--gold);color:#fff3d6;
  font-size:18px;font-weight:700;box-shadow:0 6px 22px rgba(160,30,20,.55),0 0 0 6px rgba(244,196,106,.18);
  display:flex;align-items:center;gap:10px;animation:pulse 1.8s ease-in-out infinite}
#actBtn .ic{font-size:24px}
#actBtn:active{transform:scale(.95)}
@keyframes pulse{50%{box-shadow:0 6px 22px rgba(160,30,20,.55),0 0 0 12px rgba(244,196,106,.06)}}
#hint{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:12;font-size:12px;
  color:rgba(255,236,200,.8);background:rgba(30,16,24,.45);padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* ===== Thông báo nhỏ ===== */
#cdPop{position:fixed;left:50%;top:calc(118px + var(--sat));transform:translate(-50%,8px);z-index:39;padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,rgba(255,226,150,.95),rgba(230,170,60,.95));color:#5a2a08;font-weight:700;font-size:14px;box-shadow:0 0 18px rgba(255,200,90,.8);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#cdPop.on{opacity:1;transform:translate(-50%,0)}
#cdPill{background:linear-gradient(180deg,rgba(120,70,10,.75),rgba(80,40,6,.75));color:#ffe4a0}
#toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translate(-50%,-10px);z-index:40;max-width:88vw;
  background:rgba(255,246,228,.96);color:#4a2416;padding:10px 16px;border-radius:14px;font-size:15px;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Bảng hoạt động (bottom sheet) ===== */
#panel{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
  background:linear-gradient(180deg,rgba(20,10,20,0) 0%,rgba(20,10,20,.35) 45%,rgba(20,10,20,.55) 100%)}
#panel.show{display:flex}
#sheet{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + var(--sab));box-shadow:0 -10px 40px rgba(0,0,0,.35);border-top:3px solid var(--gold2);
  animation:up .32s cubic-bezier(.2,.9,.3,1.1);user-select:text;-webkit-user-select:text}
#panel.light{background:transparent}
#panel.light #sheet{background:linear-gradient(180deg,rgba(255,244,226,.93),rgba(246,227,196,.96))}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){#panel{align-items:center}#sheet{border-radius:22px;border:3px solid var(--gold2)}#panel.light{align-items:flex-end;padding-bottom:16px}}
@media (max-height:560px){#panel.light #sheet{max-height:62vh}.arena{height:170px}}
#xBtn{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(120,60,30,.1);font-size:22px;color:#6a3a22}
.h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:0 40px 6px 0;color:var(--red2)}
.sub{font-size:14px;color:#6b4a36;margin:0 0 14px;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1;min-width:130px;min-height:64px;border-radius:16px;background:linear-gradient(180deg,#d8443a,#a32420);color:#fff3d6;
  font-size:18px;font-weight:700;border:2px solid var(--gold2);box-shadow:0 4px 12px rgba(150,30,20,.3);padding:8px 14px}
.big small{display:block;font-weight:400;font-size:12px;opacity:.85}
.big.alt{background:linear-gradient(180deg,#fff8ea,#f0dcb8);color:#7a2a18;border-color:#d9b47a}
.big:active{transform:scale(.97)}
.big:disabled{opacity:.45}
.note{font-size:12px;color:#8a6a52;text-align:center;margin-top:10px}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf7;border:2px solid #e3c79a;border-radius:14px;padding:12px;outline:none;user-select:text;-webkit-user-select:text}
textarea{height:96px;resize:none}
textarea:focus,input[type=text]:focus{border-color:var(--gold2)}
.cnt{text-align:right;font-size:12px;color:#8a6a52;margin:4px 2px 10px}
.err{color:#b3262b;font-size:13px;min-height:18px;margin:4px 0}
.choice{flex:1;min-width:140px;border:2px solid #e3c79a;border-radius:16px;padding:12px;background:#fffaf0;text-align:left;color:var(--ink)}
.choice b{display:block;font-size:16px;color:#8a2a1a}
.choice span{font-size:12px;color:#7a5a46}
.choice.on{border-color:var(--red);background:#fff0e0;box-shadow:0 0 0 3px rgba(179,38,43,.15)}

/* Trò chơi nhịp: chuông & mõ */
.arena{position:relative;height:240px;margin:6px 0 10px;display:grid;place-items:center;touch-action:none;cursor:pointer;border-radius:18px;
  background:radial-gradient(circle,rgba(255,220,150,.35),rgba(255,220,150,0) 70%)}
.target{position:absolute;width:120px;height:120px;border-radius:50%;border:5px solid var(--gold2);box-shadow:0 0 18px rgba(217,164,65,.6) inset}
.ring{position:absolute;width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,140,60,.95);box-shadow:0 0 16px rgba(255,140,60,.8);will-change:transform}
.center{position:relative;width:96px;height:96px;display:grid;place-items:center;pointer-events:none}
.judge{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#a32420;transition:opacity .4s;pointer-events:none}
.judge.ok{color:#2f7a3a}.judge.mid{color:#b07a10}.judge.off{color:#9a6a5a}
.bar{height:8px;border-radius:4px;background:#ead3ad;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#b3262b)}
.chant{text-align:center;font-family:Georgia,serif;font-size:22px;margin:8px 0;color:#7a4a2a;letter-spacing:.5px}
.chant span{transition:color .15s,transform .15s;display:inline-block;margin:0 3px}
.chant span.on{color:#b3262b;transform:scale(1.18)}
.score{font-family:Georgia,serif;font-size:56px;text-align:center;color:#a32420;line-height:1}
.score small{font-size:20px;color:#8a6a52}

/* Xin quẻ */
.tube{width:110px;height:200px;margin:4px auto;position:relative;touch-action:none;cursor:pointer}
.tube.shake{animation:shake .14s linear infinite}
@keyframes shake{25%{transform:rotate(-7deg) translateY(-3px)}75%{transform:rotate(7deg) translateY(2px)}}
.stick{position:absolute;left:50%;top:0;width:12px;height:120px;margin-left:-6px;border-radius:4px;background:linear-gradient(90deg,#d8b06a,#b88a44);border-top:12px solid #b3262b;opacity:0}
.stick.out{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translateY(40px)}60%{opacity:1;transform:translateY(-90px) rotate(18deg)}100%{opacity:0;transform:translateY(-110px) rotate(25deg)}}
.card{margin:6px auto;max-width:420px;border-radius:18px;padding:18px;background:linear-gradient(180deg,#b3262b,#7f1916);color:#fff1d2;border:3px solid var(--gold);
  text-align:center;animation:flip .6s ease-out;box-shadow:0 8px 24px rgba(120,20,10,.35)}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg)}}
.card .n{font-family:Georgia,serif;font-size:30px;color:var(--gold)}
.card .t{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.card p{font-family:Georgia,serif;font-size:19px;line-height:1.45;margin:12px 0 6px}
.card .g{font-size:11px;opacity:.75}

/* Sổ cầu an */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px}
.stat{background:#fffaf0;border:1px solid #ecd3a8;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:Georgia,serif;font-size:26px;color:#a32420}
.stat span{font-size:12px;color:#7a5a46}
.list{list-style:none;margin:0 0 14px;padding:0}
.list li{background:#fffaf0;border:1px solid #ecd3a8;border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px;line-height:1.4}
.list li small{display:block;color:#9a7a62;font-size:11px}
.h3{font-family:Georgia,serif;font-size:17px;color:#7a2a18;margin:6px 0}
.preview{display:block;width:100%;max-width:340px;margin:0 auto 12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Ủng hộ */
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.amt{min-height:48px;border-radius:12px;border:2px solid #e3c79a;background:#fffaf0;color:#7a2a18;font-weight:700;font-size:15px}
.amt.on{border-color:var(--red);background:#fff0e0;box-shadow:0 0 0 3px rgba(179,38,43,.15)}
.qrbox{width:min(260px,70vw);margin:4px auto 8px;background:#fff;border-radius:16px;padding:8px;border:2px solid #e3c79a}
.qrbox svg{display:block;width:100%;height:auto}
.acc{text-align:center;font-size:14px;line-height:1.5;color:#4a2a1a}
.acc b{color:#8a1f1c}
/* Gieo quẻ Dịch & thưởng trà */
.dich{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0;background:linear-gradient(180deg,#7f1916,#5c120f);border:2px solid var(--gold);border-radius:16px;padding:14px}
.coins{display:flex;gap:8px}.coin{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#5a3a10;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c9963a 70%,#8a6020);border:2px solid #f4d58a;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.coin.up{background:radial-gradient(circle at 35% 30%,#fff3c8,#e0b050 70%,#a87a2a)}
.coins.spin .coin{animation:coinspin .65s ease-out}@keyframes coinspin{0%{transform:translateY(0) rotateX(0)}40%{transform:translateY(-34px) rotateX(540deg)}100%{transform:translateY(0) rotateX(1080deg)}}
.hx{min-width:96px;min-height:108px;display:flex;align-items:flex-end}
.tra{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}.tra span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#f3ead8;border:2px solid #e3c79a;opacity:.55}
.tra span.on{opacity:1;border-color:var(--red);transform:scale(1.12)}.tra span.ok{opacity:1;background:#e6f0dc;border-color:#9ab87a}
/* Thư các */
input[type=search]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffdf7;border:2px solid #e3c79a;border-radius:14px;padding:11px 12px;outline:none;margin:8px 0 2px;user-select:text;-webkit-user-select:text;-webkit-appearance:none}
input[type=search]:focus{border-color:var(--gold2)}
.loi{background:linear-gradient(180deg,#7f1916,#5c120f);color:#fff1d2;border:2px solid var(--gold);border-radius:14px;padding:10px 14px;margin:6px 0}
.loi p{margin:0;font-family:Georgia,serif;font-size:16px;line-height:1.45}.loi small{display:block;margin-top:4px;font-size:11px;opacity:.75}
.list.lib li.bk{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px}.list.lib li.rd{background:#f7f1e3}
.list.lib .bt{flex:1;min-width:0}.list.lib .bt b{display:block;font-size:14px}.list.lib .bt i{display:block;font-size:12px;color:#6a4a32;margin-top:2px}
.list.lib .bt a.ba{display:inline-block;margin-top:4px;font-size:12px;color:#a32420;text-decoration:underline}
.list.lib .bf{flex:none;width:40px;height:40px;border-radius:10px;background:#fff3dc;border:1px solid #e3c79a;font-size:20px;color:#c98a1a;line-height:1}
.list.lib .bo{flex:none;padding:10px 12px;border-radius:10px;background:linear-gradient(180deg,#d8443a,#a32420);color:#fff3d6;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
a.big{display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;text-align:center}
#panel.libp .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}#panel.libp .chip{flex:none;white-space:nowrap}
.linkbtn{display:block;margin:10px auto 0;color:#a32420;text-decoration:underline;font-size:14px;background:none}
.thanks{margin:10px 0;text-align:center;font-size:13px;color:#7a5a46}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tier{border:2px solid #e3c79a;border-radius:14px;background:#fffaf0;padding:8px 4px;color:#4a2a1a;text-align:center;line-height:1.25}
.tier .ti{display:block;font-size:22px}.tier b{display:block;font-size:14px;color:#8a1f1c}.tier span:last-child{font-size:12px;color:#7a5a46}
.tier.on{border-color:var(--red);background:#fff0e0;box-shadow:0 0 0 3px rgba(179,38,43,.15)}
.perk{text-align:center;font-size:13px;color:#6a3a22;margin:2px 0 10px;min-height:18px}
.lbl2{display:block;font-size:13px;color:#7a5a46;margin:8px 2px 4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#4a2a1a;margin:8px 2px}
.chk input{width:20px;height:20px;accent-color:#b3262b}
.honor h4{margin:12px 0 4px;font-size:15px}.honor p{margin:0;font-size:14px;line-height:1.6;color:#4a2a1a}
.honor small{color:#9a7a62}

/* ===== Màn chào ===== */
#welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,160,90,.55),rgba(0,0,0,0) 60%),linear-gradient(180deg,rgba(40,30,80,.82),rgba(140,60,90,.7) 55%,rgba(70,30,40,.86));
  text-align:center;transition:opacity .6s}
#welcome.fade{opacity:0;pointer-events:none}
.lotus{width:92px;height:60px;margin-bottom:6px}

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   0. TIỆN ÍCH CHUNG
   ===================================================================== */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function angDamp(a, b, k, dt) { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d * (1 - Math.exp(-k * dt)); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IS_TOUCH = (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer:coarse)').matches;
const fmtDate = ts => { const d = new Date(ts); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); };
let toastTimer = 0;

/* =====================================================================
   1. LƯU TRÊN MÁY (localStorage) — "Sổ cầu an của tôi"
   ===================================================================== */
const STORE_KEY = 'lenDenThanhVan_v1';
const store = { name: '', incenseTimes: 0, sticks: 0, bestTamAn: 0, lastTamAn: 0, bells: 0, wishes: [], que: [], tutorialDone: false, muted: false };
try { Object.assign(store, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { }

/* =====================================================================
   1b. CẤU HÌNH "BỒ ĐỀ TÂM" (phát tâm ủng hộ) — chủ game tự điền.
       Để trống tài khoản/apiBase/kofi = ẩn toàn bộ phần phát tâm và bảng công đức.
       recipientType:
         'chua'         → CHỈ chọn khi tài khoản nhận đúng là của một ngôi chùa thật và chùa đã đồng ý.
                          Lời mời ghi "cúng dường Tam Bảo, duy trì hương khói <templeName>".
         'nguoilamgame' → (mặc định) tài khoản cá nhân của người làm game. Lời mời ghi rõ
                          "duy trì hương khói đền ảo Thanh Vân" và tên người nhận, để không ai hiểu lầm.
   ===================================================================== */
const DONATE = {
  recipientType: 'nguoilamgame',
  templeName: 'Bồ đề tâm game', // 'chua': tên chùa thật · 'nguoilamgame': tên dự án hiện cạnh "đền ảo Thanh Vân"
  bankBin: '970422', // MB Bank — mã BIN NAPAS: MB 970422 · Vietcombank 970436 · Techcombank 970407 · VPBank 970432 · ACB 970416 · BIDV 970418 · VietinBank 970415 · TPBank 970423
  accountNo: '0890149089999', // số tài khoản nhận
  accountName: 'DO VIET TU', // tên chủ tài khoản, IN HOA KHÔNG DẤU
  apiBase: '',      // URL Cloudflare Worker (thư mục worker/) để nhận qua payOS, tự xác nhận và có bảng công đức chung
  kofi: '',         // tuỳ chọn, cho người ở nước ngoài
  memo: 'CONG DUC',// đầu nội dung chuyển khoản (không dấu); tên ghi danh nối phía sau, tối đa 25 ký tự
  honorRoll: [],    // ghi danh thủ công (khi dùng VietQR tĩnh), vd { name: 'Gia đình ông Nguyễn Văn A', tier: 3 }
};
// Các gói phát tâm — mỗi gói một cách ghi danh khác nhau trên bảng công đức (chỉ là ghi danh, không đổi được gì trong game)
const TIERS = [
  { id: 1, name: 'Nén hương', amount: 20000, ic: '🙏', color: '#7a4a2a', perk: 'Ghi danh hàng Nén hương' },
  { id: 2, name: 'Ngọn đèn', amount: 50000, ic: '🕯️', color: '#b0620f', perk: 'Ghi danh kèm ngọn đèn sáng' },
  { id: 3, name: 'Đoá sen', amount: 100000, ic: '🪷', color: '#c2456e', perk: 'Ghi danh chữ hồng sen' },
  { id: 4, name: 'Cành trúc', amount: 200000, ic: '🎋', color: '#2f7a4a', perk: 'Ghi danh chữ xanh trúc, hàng trên' },
  { id: 5, name: 'Chuông đồng', amount: 500000, ic: '🔔', color: '#b8860b', perk: 'Ghi danh chữ vàng, hàng đầu bảng' },
];
const TIER0 = { id: 0, name: 'Tuỳ tâm', amount: 10000, ic: '🤍', color: '#6b5a4a', perk: 'Ghi danh hàng Tuỳ tâm' };
const tierOf = a => { let t = TIER0; for (const x of TIERS) if (a >= x.amount) t = x; return t; };
const tierById = id => TIERS.find(t => t.id === id) || TIER0;
const IS_REAL_TEMPLE = DONATE.recipientType === 'chua' && !!DONATE.templeName;
/* 1c. ĐỀN TRỰC TUYẾN — dán URL máy chủ phòng chùa sau khi triển khai (docs/HUONG-DAN-CLOUDFLARE.md).
   Để trống = chơi một mình với khách hành hương AI. */
const ONLINE = { url: '' };
if (/github\.io$/.test(location.hostname)) ONLINE.url = 'wss://bodetam.doviettudn.workers.dev/room/thanh-van'; // bản GitHub Pages nối về máy chủ Cloudflare
else if (/^https?:$/.test(location.protocol)) ONLINE.url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/room/thanh-van'; // chạy trên Worker bodetam: cùng địa chỉ
// mở file trực tiếp (file://) thì chơi một mình
const DONATE_ON = !!((DONATE.bankBin && DONATE.accountNo) || DONATE.apiBase || DONATE.kofi);
// Mã VietQR (chuẩn EMVCo/NAPAS 247) tự sinh trên máy, không gửi số tài khoản đi đâu
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
const asciiMemo = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').replace(/[^A-Za-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
function vietQR(bin, acc, amount, memo) {
  const cons = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA');
  let p = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', cons) + tlv('53', '704') + (amount ? tlv('54', String(amount)) : '') + tlv('58', 'VN') + (memo ? tlv('62', tlv('08', memo.slice(0, 25))) : '') + '6304';
  return p + crc16(p);
}
let qrLib = null;
function loadQR() { // thư viện vẽ mã QR, chỉ tải khi mở bảng ủng hộ
  if (qrLib) return qrLib;
  qrLib = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; s.onload = () => res(window.qrcode); s.onerror = () => { qrLib = null; rej(new Error('qr')); }; document.head.appendChild(s); });
  return qrLib;
}
async function qrSvg(text) { const q = (await loadQR())(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 5, margin: 3, scalable: true }); }

/* Lọc từ thô tục: danh sách đơn giản, so khớp theo nguyên từ (giữ dấu tiếng Việt) */
const BAD_WORDS = ['địt', 'đụ', 'đù', 'lồn', 'cặc', 'buồi', 'đéo', 'đĩ', 'điếm', 'đm', 'đmm', 'dm', 'dmm', 'đcm', 'dcm', 'đcmm', 'dcmm', 'vcl', 'vkl', 'vl', 'clgt', 'cl', 'cc', 'cmm', 'cmn', 'loz', 'lozz', 'djt', 'đjt', 'cứt', 'ngu', 'fuck', 'fucking', 'shit', 'bitch', 'dick', 'pussy', 'asshole',
  'óc chó', 'mẹ kiếp', 'khốn nạn', 'súc vật', 'chó chết', 'thằng chó', 'con chó', 'đồ chó', 'mả mẹ', 'dit me', 'du ma', 'đù má', 'đụ má', 'địt mẹ', 'vãi lồn', 'vãi l', 'ngu như'];
function hasBad(text) {
  const t = ' ' + text.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ') + ' ';
  return BAD_WORDS.some(w => t.includes(' ' + w + ' '));
}

/* =====================================================================
   2. ÂM THANH — tạo hoàn toàn bằng Web Audio
      gió, chim, lá, côn trùng, tụng kinh rì rầm, chuông xa, mõ, hiệu ứng
   ===================================================================== */
const SND = (() => {
  let ctx = null, master, sfx, amb, revIn, noiseBuf, chantBus, ambLP, windGain, leafGain;
  let nextSyl = 0, sylIdx = 0, phrase = 0, chantPaused = false, timers = { bird: 2, cricket: 1, leaf: 1, bell: 18 };
  const S = { muted: !!store.muted, ready: false };
  function noise(sec, brown) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0); let l = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; if (brown) { l = (l + 0.02 * w) / 1.02; d[i] = l * 3.5; } else d[i] = w; }
    return b;
  }
  function ir(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function gainNode(v, to) { const g = ctx.createGain(); g.gain.value = v; if (to) g.connect(to); return g; }
  S.init = () => {
    if (ctx) { ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); S.ctx = ctx;
    master = gainNode(S.muted ? 0 : 0.9, ctx.destination);
    const conv = ctx.createConvolver(); conv.buffer = ir(3.4, 2.4); revIn = gainNode(1); revIn.connect(conv); conv.connect(gainNode(0.55, master));
    sfx = gainNode(1, master);
    amb = gainNode(0, master); amb.gain.setValueAtTime(0, ctx.currentTime); amb.gain.linearRampToValueAtTime(1, ctx.currentTime + 4);
    ambLP = ctx.createBiquadFilter(); ambLP.type = 'lowpass'; ambLP.frequency.value = 1400; ambLP.connect(amb); ambLP.connect(gainNode(0.6, revIn));
    noiseBuf = noise(2, false);
    // Gió: nhiễu nâu + lọc thấp có LFO
    const wind = ctx.createBufferSource(); wind.buffer = noise(6, true); wind.loop = true;
    const wlp = ctx.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 420;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lfoG = gainNode(220); lfo.connect(lfoG); lfoG.connect(wlp.frequency);
    windGain = gainNode(0.32, amb); wind.connect(wlp); wlp.connect(windGain);
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.045; const lfo2G = gainNode(0.12); lfo2.connect(lfo2G); lfo2G.connect(windGain.gain);
    wind.start(); lfo.start(); lfo2.start();
    // Lá xào xạc: nhiễu trắng qua lọc dải cao, to nhỏ theo cơn gió
    const leaf = ctx.createBufferSource(); leaf.buffer = noiseBuf; leaf.loop = true;
    const lbp = ctx.createBiquadFilter(); lbp.type = 'bandpass'; lbp.frequency.value = 5200; lbp.Q.value = 0.7;
    leafGain = gainNode(0.02, amb); leaf.connect(lbp); lbp.connect(leafGain); leaf.start();
    // Kênh tụng kinh (âm lượng theo khoảng cách tới chính điện)
    chantBus = gainNode(0.05, ambLP);
    nextSyl = ctx.currentTime + 1.5;
    S.ready = true;
  };
  S.setMuted = m => { S.muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.08); };
  S.suspend = () => { if (ctx && ctx.state === 'running') ctx.suspend(); };
  S.resume = () => { if (ctx && ctx.state !== 'running') ctx.resume(); };

  // Chuông đồng: nhiều bội âm không điều hoà, tắt dần chậm
  S.bell = ({ vol = 1, f0 = 98, dur = 9, distant = false, delay = 0 } = {}) => {
    if (!ctx) return; const t = ctx.currentTime + delay;
    const out = gainNode(vol, distant ? ambLP : sfx); out.connect(gainNode(distant ? 0.3 : 0.5, revIn));
    const P = [[0.5, .55, 1], [1, 1, .85], [1.19, .55, .6], [1.5, .4, .5], [2, .42, .4], [2.51, .25, .28], [2.66, .2, .22], [3.01, .14, .16], [4.17, .1, .1], [5.43, .06, .07]];
    for (const [r, a, dd] of P) for (const det of [-0.35, 0.35]) {
      const o = ctx.createOscillator(); o.frequency.value = f0 * r + det;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a * 0.08, t + 0.006);

      if (diff < 0.13) { st.perfect++; judge.className = 'judge ok'; judge.textContent = 'Đúng nhịp — chuông ngân thật trong!'; SND.bell({ vol: 1, f0: 98, dur: 12, delay: 0.43 }); strikeBell(1); }
      else if (diff < 0.32) { judge.className = 'judge mid'; judge.textContent = 'Gần đúng nhịp'; SND.bell({ vol: 0.65, f0: 98, dur: 6, delay: 0.43 }); strikeBell(0.6); }
      else { judge.className = 'judge off'; judge.textContent = 'Nhẹ quá, lần sau nhé'; SND.bell({ vol: 0.32, f0: 98, dur: 2.6, delay: 0.43 }); strikeBell(0.3); }
      judge.style.opacity = '1'; cnt.textContent = `Tiếng chuông: ${st.hits}/3`;
    }
  };
  $('#bArena').addEventListener('pointerdown', e => { e.preventDefault(); G.game && G.game.tap(); });
  function finish() {
    st.done = true; store.bells += 3; save(); bumpCounter(); qev('bell');
    pbody.innerHTML = `<div class="h2">Thỉnh chuông</div><div style="text-align:center;font-size:54px">🔔</div>
      <p class="sub" style="text-align:center">Bạn đã thỉnh 3 tiếng chuông · <b>${st.perfect}</b> tiếng đúng nhịp.<br>Tiếng chuông ngân xa, gửi lời bình an tới muôn nơi.</p>
      <div class="row"><button class="big alt" id="bAgain">Thỉnh lại</button><button class="big" id="bDone">Xong</button></div>`;
    $('#bAgain').onclick = () => { SND.tap(); closePanel(false); setTimeout(actBell, 50); };
    $('#bDone').onclick = () => { SND.tap(); closePanel(false); };
  }
}

/* --- 16.3 Gõ khánh đọc kinh: trò theo nhịp ~30 giây, chấm "Tĩnh tâm / Được / Lệch nhịp", điểm Tâm an --- */
const MO_SVG = `<svg viewBox="0 0 100 80" width="104" height="84" aria-hidden="true"><path d="M50 4v14" stroke="#5a3a1a" stroke-width="3"/><path d="M6 52 Q50 8 94 52 L86 64 Q50 30 14 64 Z" fill="#6f7f72"/><path d="M14 56 Q50 20 86 56" stroke="#93a596" stroke-width="3" fill="none" opacity=".7"/><circle cx="50" cy="24" r="4" fill="#3a3a32"/></svg>`;
const SYL = ['Đạo', 'khả', 'đạo', 'phi', 'thường', 'Đạo'], SYL_V = [0, 0, 0, 2, 1, 0];
function praise(s) {
  if (s >= 90) return 'Tâm như mặt hồ phẳng lặng. Thật an nhiên!';
  if (s >= 75) return 'Nhịp khánh đều đặn, lòng đã an rồi đó.';
  if (s >= 55) return 'Rất tốt, hơi thở đã chậm lại và nhẹ nhàng hơn.';
  if (s >= 35) return 'Cứ từ từ thôi, mỗi tiếng khánh là một hơi thở.';
  return 'Không sao cả — ngồi xuống lắng lòng đã là tâm an rồi.';
}
function actMo() {
  player.x = MO.x; player.z = MO.z; player.yaw = Math.PI; player.sitT = 1; player.prayT = 0.5;
  cam.focus = { x: 0, y: HALL.F + 2.6, z: -24.6, yaw: 0.22, pitch: 0.06, dist: 6.8 };
  SND.pauseChant(true);
  const end = () => { G.game = null; cam.focus = null; player.sitT = 0; player.prayT = 0; SND.pauseChant(false); };
  openPanel(`<div class="h2">Gõ khánh đọc kinh</div><p class="sub">Trong khoảng 30 giây, chạm vào khánh đá đúng lúc vòng nhịp co vào trùng viền vàng. Thở chậm, gõ đều, đọc câu mở đầu Đạo Đức Kinh: "Đạo khả đạo, phi thường Đạo".</p>
    <div class="row"><button class="big" id="moGo">Bắt đầu đọc</button></div><div class="note">Máy tính: có thể dùng phím Space.</div>`,
    { light: true, modal: true, onClose: end });
  $('#moGo').onclick = () => { SND.tap(); startMo(); };
}
function startMo() {
  const BEAT = 0.8, LEAD = 2.4, N = 37, t0 = performance.now() / 1000 + LEAD;
  const beats = Array.from({ length: N }, (_, k) => ({ t: t0 + k * BEAT, j: null, v: false }));
  const cnt = { p: 0, g: 0, o: 0, m: 0 };
  pbody.innerHTML = `<div class="h2">Gõ khánh đọc kinh</div><div class="bar"><i id="mBar"></i></div>
    <div class="chant" id="mChant">${SYL.map(s => `<span>${s}</span>`).join('')}</div>
    <div class="arena" id="mArena"><div class="target"></div><div class="ring" id="mRing"></div><div class="center">${MO_SVG}</div><div class="judge" id="mJudge">Chuẩn bị…</div></div>
    <div style="text-align:center;font-size:13px;color:#7a5a46" id="mStat">Tĩnh tâm 0 · Được 0 · Lệch nhịp 0</div>`;
  const ring = $('#mRing'), judge = $('#mJudge'), bar = $('#mBar'), spans = [...$('#mChant').children], stat = $('#mStat');
  let jT = 0, finished = false;
  const show = (txt, cls) => { judge.textContent = txt; judge.className = 'judge ' + cls; judge.style.opacity = '1'; jT = 0.6; };
  const upd = () => stat.textContent = `Tĩnh tâm ${cnt.p} · Được ${cnt.g} · Lệch nhịp ${cnt.o + cnt.m}`;
  G.game = {
    update(dt) {
      if (finished) return;
      const now = performance.now() / 1000;
      if (now < t0 - 0.1) { judge.textContent = String(Math.ceil(t0 - now)); judge.className = 'judge'; }
      jT -= dt; if (jT < 0 && now > t0) judge.style.opacity = '0';
      let cur = -1;
      beats.forEach((b, k) => {
        if (!b.v && b.t - now < 0.12) { b.v = true; SND.syllable(SND.now() + Math.max(0, b.t - now), SYL_V[k % 6], k % 6 === 5 ? 104 : 116, 0.32); }
        if (now >= b.t - 0.06) cur = k;
        if (!b.j && now > b.t + 0.38) { b.j = 'm'; cnt.m++; show('Lệch nhịp', 'off'); upd(); }
      });
      spans.forEach((s, i) => s.classList.toggle('on', cur >= 0 && cur % 6 === i && now - beats[cur].t < 0.5));
      const nb = beats.find(b => !b.j && b.t > now - 0.38);
      if (nb && nb.t - now < BEAT * 1.15) { const s = 1 + Math.max(0, nb.t - now) / BEAT * 1.3; ring.style.opacity = '1'; ring.style.transform = `scale(${s.toFixed(3)})`; } else ring.style.opacity = '0';
      bar.style.width = clamp((now - t0) / (N * BEAT) * 100, 0, 100) + '%';
      if (now > beats[N - 1].t + 0.6) finish();
      player.bowT = 0.08 + 0.05 * Math.sin(now * 2);
    },
    tap() {
      if (finished) return;
      const now = performance.now() / 1000; let best = null, bd = 9;
      for (const b of beats) if (!b.j) { const d = Math.abs(now - b.t); if (d < bd) { bd = d; best = b; } }
      player.ring = 0.6;
      if (!best || bd > 0.38) { SND.mo(0.4, 0.95); return; }
      if (bd <= 0.09) { best.j = 'p'; cnt.p++; SND.mo(0.9, 1); show('Tĩnh tâm', 'ok'); }
      else if (bd <= 0.2) { best.j = 'g'; cnt.g++; SND.mo(0.8, 1); show('Được', 'mid'); }
      else { best.j = 'o'; cnt.o++; SND.mo(0.6, 0.94); show('Lệch nhịp', 'off'); }
      upd();
    }
  };
  $('#mArena').addEventListener('pointerdown', e => { e.preventDefault(); G.game && G.game.tap(); });
  function finish() {
    finished = true; G.game = null;
    const score = Math.round(100 * (cnt.p + cnt.g * 0.7 + cnt.o * 0.25) / N);
    const isBest = score > store.bestTamAn; store.lastTamAn = score; store.bestTamAn = Math.max(store.bestTamAn, score); save(); bumpCounter(); qev('mo');
    SND.chime();
    pbody.innerHTML = `<div class="h2">Tâm an</div><div class="score">${score}<small>/100</small></div>
      <p class="sub" style="text-align:center;font-size:16px;margin-top:10px">${praise(score)}</p><div class="loi"><p>“${esc(DDK_LINES[randi(0, DDK_LINES.length - 1)][0])}”</p><small>— diễn ý Đạo Đức Kinh</small></div>
      <p class="note">Tĩnh tâm ${cnt.p} · Được ${cnt.g} · Lệch nhịp ${cnt.o + cnt.m}${isBest ? ' · <b>Điểm cao nhất mới!</b>' : ` · Cao nhất: ${store.bestTamAn}`}</p>
      <div class="row" style="margin-top:12px"><button class="big alt" id="mAgain">Đọc lại</button><button class="big alt" id="mShare">Chia sẻ</button><button class="big" id="mDone">Xong</button></div>${donateLink()}`;
    bindDonate();
    $('#mAgain').onclick = () => { SND.tap(); startMo(); };
    $('#mShare').onclick = () => { SND.tap(); closePanel(false); openShare(); };
    $('#mDone').onclick = () => { SND.tap(); closePanel(false); };
  }
}

function doWish(text, k) {
  store.wishes.unshift({ text, type: k, at: Date.now() }); store.wishes = store.wishes.slice(0, 60); save(); bumpCounter(); qev('wish'); if (k === 'den') qev('den');

  });

const netEnabled = () => !!ONLINE.url && store.online !== false;
function netSend(o) { if (NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(o)); }
function netConnect() {
  if (!netEnabled() || NET.ws || G.mode !== 'play') return;
  let ws; try { ws = new WebSocket(ONLINE.url + (NET.room ? '-' + NET.room : '')); } catch (_) { return; }
  NET.ws = ws;
  ws.onopen = () => { NET.retry = 1; netSend({ t: 'hi', name: store.name, look: player.look, x: player.x, z: player.z, yaw: player.yaw }); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } netMsg(m); };

    if (e.code === 4003) { store.online = false; save(); toast('Bạn đã được mời rời phòng chung. Vẫn có thể lên đền một mình 🙏', 4000); return; }

  };
}
function addPeer(m) {

  const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.style.opacity = '0'; labelsEl.appendChild(lbl);
  NET.peers.set(m.id, { id: m.id, c, lbl, x: m.x, z: m.z, tx: m.x, tz: m.z, yaw: m.yaw, tyaw: m.yaw, a: m.a || 0, name: m.name || '', bond: !!m.name, gifted: false, giftedMe: false, muted: false,

    case 'say': if (p && !p.muted) { const b = bubbles.find(x => !x.p || x.p === p); if (b) { b.p = p; b.t = 3.6; b.el.textContent = PHRASES[m.k] || PHRASES[0]; b.el.classList.add('on'); } } break;

  const list = [...NET.peers.values()];

    if (vis) animRemote(p, dt);
    if (vis && !near && p.d < 2.2) near = p;
